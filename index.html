<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxHome Reply Assistant V4</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,Segoe UI,Arial,sans-serif}
  .wrap{max-width:940px;margin:40px auto;padding:0 20px}
  .card{background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(20,35,60,.07)}
  h1{margin:0 0 6px;font-size:25px}
  .sub{color:#657084;margin:0 0 24px}
  label{display:block;font-weight:650;margin:18px 0 8px}
  textarea{width:100%;min-height:150px;border:1px solid #cfd7e3;border-radius:10px;padding:13px;font:inherit;resize:vertical;outline:none}
  textarea:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.12)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .choice{border:1px solid #d5dce7;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}
  .choice.active{border-color:#536dfe;background:#eef1ff;color:#2940bb;font-weight:650}
  button{border:0;border-radius:9px;padding:11px 16px;font-weight:650;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .primary{background:#4f46e5;color:white;margin-top:20px;width:100%;font-size:15px}
  .secondary{background:#eef1f6;color:#273449}
  .danger{background:#fff0f0;color:#b42318}
  .output{margin-top:22px;border-top:1px solid #e8ecf2;padding-top:20px}
  .reply{background:#f8f9fc;border:1px solid #e1e6ee;border-radius:10px;padding:16px;min-height:100px;white-space:pre-wrap;line-height:1.55}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .hint{font-size:12px;color:#788397;margin-top:8px}
  .status{font-size:12px;margin-top:9px;color:#657084}
  .jira{margin-top:18px;border-top:1px dashed #dde3ec;padding-top:16px}
  .jiraTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .jiraTitle label{margin:0}
  .jiraBox{background:#fff;border:1px solid #d9e0ea;border-radius:10px;padding:14px;min-height:76px;line-height:1.5}
  .jiraField{margin:0 0 10px}
  .jiraLabel{font-weight:700}
  .jiraValue{margin-top:2px}
  .jiraDescription{white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>MaxHome Reply Assistant</h1>
    <p class="sub">Paste a client remark, add context if needed, and generate a concise client-ready response.</p>

    <label for="remark">Client Remark</label>
    <textarea id="remark" placeholder="Paste the client's remark here..."></textarea>

    <label for="context">Additional Context <span style="font-weight:400;color:#788397">(optional)</span></label>
    <textarea id="context" style="min-height:90px" placeholder="Example: We already fixed the address.&#10;Or: This is a high-priority issue and the team is reviewing it."></textarea>

    <label>Status</label>
    <div class="row" id="status">
      <button class="choice active" data-value="auto">Auto-detect</button>
      <button class="choice" data-value="fixed">Fixed / Updated</button>
      <button class="choice" data-value="reviewing">Being Reviewed</button>
      <button class="choice" data-value="notfixed">Not Fixed Yet</button>
    </div>

    <label>Response Style</label>
    <div class="row" id="tone">
      <button class="choice active" data-value="professional">Professional + Concise</button>
      <button class="choice" data-value="friendly">Friendly</button>
      <button class="choice" data-value="short">Very Short</button>
      <button class="choice" data-value="apologetic">More Apologetic</button>
    </div>

    <button class="primary" onclick="generateReply()">Generate Reply</button>
    <div class="status" id="statusMsg"></div>

    <div class="output">
      <label style="margin-top:0">Suggested Reply</label>
      <div class="reply" id="reply">Your generated response will appear here.</div>
      <div class="actions">
        <button class="secondary" onclick="copyReply()">Copy Reply</button>
        <button class="secondary" onclick="generateReply()">Regenerate</button>
        <button class="secondary" onclick="shorten()">Make Shorter</button>
        <button class="secondary" id="jiraBtn" onclick="generateJiraSummary()" disabled>Create Jira Summary</button>
        <button class="danger" onclick="clearAll()">Clear</button>
      </div>

      <div class="jira" id="jiraSection" style="display:none">
        <div class="jiraTitle">
          <label>Jira Summary</label>
        </div>
        <div class="jiraBox" id="jiraSummary"></div>
        <div class="actions">
          <button class="secondary" onclick="copyJiraSummary()">Copy Jira Summary</button>
        </div>
      </div>

      <div class="hint">This V4 runs locally in your browser. It does not connect to Slack or Jira.</div>
    </div>
  </div>
</div>

<script>
let selectedStatus="auto", selectedTone="professional", lastRemark="", lastContext="";

document.querySelectorAll("#status .choice").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#status .choice").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    selectedStatus=b.dataset.value;
  };
});

document.querySelectorAll("#tone .choice").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#tone .choice").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    selectedTone=b.dataset.value;
  };
});

function clean(s){ return s.replace(/\s+/g," ").trim(); }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }

const DOC_NAMES = [
  "Residential Real Estate Listing Agreement Exclusive Right to Sell",
  "One to Four Family Residential Contract",
  "One To Four Family Residential Contract",
  "Buyer/Tenant Representation Agreement - Long",
  "Buyer Tenant Representation Agreement - Long",
  "Better Homes And Gardens Real Estate Gary Greene Privacy Policy",
  "T-47.1 Residential Real Property Declaration In Lieu Of Affidavit",
  "MLS Input Sheet",
  "MLS Print Out",
  "Lead Paint Addendum",
  "Wire Fraud Warning",
  "Funding Requests",
  "Transaction Summary",
  "New Home Contract (Completed Construction)",
  "Amendment",
  "General Information and Notice to Consumer",
  "Addendum for property Subject to Mandatory Membership in a property owners association",
  "Addendum for Property Subject to Mandatory Membership in a Property Owners Association"
];

function extractDocument(text){
  for(const d of DOC_NAMES){
    if(text.toLowerCase().includes(d.toLowerCase())) return d;
  }
  return "";
}

function extractFields(text){
  const fields=[];
  const patterns=[
    /Property Address/ig,/Closing Date/ig,/Buyer Agent Email/ig,/Seller Agent Email/ig,
    /Buyer'?s? Agent Email/ig,/Seller'?s? Agent Email/ig,/Monthly Rental Price/ig,
    /Total Compensation %?/ig,/Total Compensation Amount/ig,/Co-op Broker Percentage/ig,
    /GF Number/ig,/Broker Signature/ig,/Scheduling Company Name/ig,/Client 2/ig,
    /Section\s*\d+[A-Za-z]?(?:\(\d+\)|\.[A-Za-z0-9]+(?:\.[A-Za-z0-9]+)*)?/ig,
    /Paragraph\s*\d+[A-Za-z]?(?:\([0-9A-Za-z]+\))?/ig
  ];
  for(const p of patterns){
    for(const m of text.matchAll(p)) fields.push(clean(m[0]));
  }
  return [...new Set(fields)];
}

function extractIssueDetails(remark){
  let r=clean(remark);
  r=r.replace(/^(hi|hello)[,!:.-]?\s*/i,"");
  r=r.replace(/^Max missed\s+\d+\s+errors?\s*(?:on this one)?\s*:?\s*/i,"");
  const parts=r.split(/\s+Also,\s+/i).map(x=>clean(x)).filter(Boolean);
  return parts.length ? parts : [r];
}

function classify(text){
  const t=text.toLowerCase();
  if(/high[- ]?priority|urgent|critical|asap|closing.{0,30}issue/.test(t)) return "high_priority";
  if(/rename|renamed|change the name|should be called|name change/.test(t)) return "rename";
  if(/new version|version .*needed|need.*version|versioning|new form|add.*recognized|drop[- ]?down/.test(t)) return "version_or_enhancement";
  if(/missing|missed|did not|didn't|cannot find|can't find|not showing|not updated|incorrect|wrong|error|requirement|should not|still showing/.test(t)) return "issue";
  return "general";
}

function issuePhrase(remark, context){
  const r=clean(remark);
  const fields=extractFields(r);
  const doc=extractDocument(r);
  const issues=extractIssueDetails(r);
  let phrase=issues.join(" Also, ");

  if(doc && !r.toLowerCase().includes(doc.toLowerCase())) phrase=`${doc}: ${phrase}`;
  if(phrase.length>360) phrase=phrase.slice(0,357).replace(/\s+\S*$/,'')+"...";
  return {phrase, issues, doc, fields};
}

function extractRequestedRename(remark){
  const r=clean(remark);
  let m=r.match(/(?:rename|change)(?: the)?(?: document)?\s+(.+?)\s+(?:to|as)\s+["'“”]?([^"'“”.,;\n]+)["'“”]?/i);
  if(m) return {oldName:clean(m[1]),newName:clean(m[2])};
  m=r.match(/(.+?)\s+(?:should be|needs to be)\s+(?:called|renamed)\s+["'“”]?([^"'“”.,;\n]+)["'“”]?/i);
  if(m) return {oldName:clean(m[1]),newName:clean(m[2])};
  return null;
}

function isExplicitlyFixed(all,status){
  return status==="fixed" || (status==="auto" && /\b(updated|fixed|corrected|processed|unarchived|added the errors|now present|should now display|has been resolved)\b/.test(all));
}

function makeReply(remark, context, status, tone){
  const all=clean(remark+" "+context);
  const allLower=all.toLowerCase();
  const category=classify(remark);
  const doc=extractDocument(remark);
  const info=issuePhrase(remark,context);
  const fields=info.fields;
  const issues=info.issues;
  const fixed=isExplicitlyFixed(allLower,status);

  if(category==="high_priority"){
    const target=doc || (fields.length?fields[0]:"issue");
    return tone==="short"
      ? `Thank you for flagging this. We’ll treat the ${target} issue as a high-priority item and the team is actively looking into it.`
      : `Thank you for flagging this, and we apologize for the inconvenience. We’ve noted the high-priority issue involving ${target}${fields.length>1?` (${fields.slice(0,4).join(", ")})`:""}. The team is actively looking into what is causing the issue so the expected behavior can be addressed without making assumptions about the fix.`;
  }

  if(category==="rename"){
    const rr=extractRequestedRename(remark);
    if(rr){
      const oldName=rr.oldName || (doc || "document");
      return `Thank you for pointing this out. We’ve noted the request to change the ${oldName} name to ${rr.newName}. We’ll review the document naming so it can be aligned with the terminology requested by your team.`;
    }
    return `Thank you for pointing this out. We’ve noted the requested document name change and the specific naming concern. We’ll review it so the document terminology can be aligned with your team’s requirement.`;
  }

  if(fixed){
    if(/address/i.test(all)) return `Thank you for flagging this. We’ve updated the Property Address on ${doc || "the transaction"}, and it should now reflect the correct information.`;
    if(/closing date/i.test(all)) return `Thank you for flagging this. We’ve updated the Closing Date on ${doc || "the transaction"}, and it should now reflect the correct information.`;
    if(/unarchived|archived/i.test(all)) return `Thank you for bringing this to our attention. The ${doc || "document"} has been unarchived, so it should now be available in the transaction.`;
    if(/document|contract|form/i.test(all)) return `Thank you for flagging this. The ${doc || "document"} has been updated or processed based on the issue reported, and it should now reflect the expected information.`;
    return `Thank you for flagging this. We’ve addressed the reported issue, and the information should now reflect correctly.`;
  }

  if(category==="version_or_enhancement"){
    if(/new version|version/i.test(allLower)){
      const vm=all.match(/(?:version|ver(?:sion)?)\s*([0-9]{1,2}[_./-][0-9]{1,2}|[0-9]{2}[_./-][0-9]{2,4})/i);
      const v=vm?vm[1]:null;
      return `Thank you for bringing this to our attention. We’ve noted the versioning requirement for ${doc || "the document"}${v?` (${v})`:""}. The team will review the version mapping so Max recognizes the correct version going forward.`;
    }
    return `Thank you for bringing this to our attention. We’ve noted the request involving ${doc || "the document"}. The team will review the related document setup and logic so the requested behavior can be handled correctly going forward.`;
  }

  if(category==="issue"){
    if(issues.length>1){
      const joined=issues.slice(0,4).map(x=>x.replace(/^The\s+/i,"").trim().replace(/[.!?]+$/,'')).join(" and ");
      return `Thank you for pointing this out, and we apologize for the inconvenience. We’ve noted the issues reported${doc ? ` for ${doc}` : ""}—${joined}. Our team is reviewing why Max did not identify or handle these items as expected and the related validation so we can address the underlying issue.`;
    }
    const detail=(issues[0] || "the reported issue").replace(/[.!?]+$/,'');
    const detailText=doc ? `the issue with ${doc}: ${detail}` : `the issue reported: ${detail}`;
    return `Thank you for flagging this, and we apologize for the inconvenience. We’ve noted ${detailText}. Our team is reviewing why Max did not handle this item as expected and the related logic or validation so we can address the underlying issue.`;
  }

  const target=doc || (fields.length?fields[0]:"the item raised");
  return `Thank you for sharing this with us. We’ve noted the point raised regarding ${target}. We’ll review the relevant setup and logic so the expected behavior is clearly understood and the appropriate next step can be determined.`;
}

function generateReply(){
  const remark=document.getElementById("remark").value.trim();
  const context=document.getElementById("context").value.trim();
  const msg=document.getElementById("statusMsg");
  const jiraBtn=document.getElementById("jiraBtn");
  if(!remark){msg.textContent="Please paste a client remark first.";return}

  lastRemark=remark; lastContext=context;
  let reply=makeReply(remark,context,selectedStatus,selectedTone);

  // Default output is intentionally 2–4 sentences. "Very Short" is the one exception.
  if(selectedTone==="short"){
    const s=reply.split(/(?<=[.!?])\s+/);
    reply=s.slice(0,2).join(" ");
  }
  if(selectedTone==="friendly") reply=reply.replace(/Thank you for flagging this/g,"Thanks for flagging this").replace(/Thank you for pointing this out/g,"Thanks for pointing this out");
  if(selectedTone==="apologetic" && !/apologize|apologies/i.test(reply)) reply="We apologize for the inconvenience. "+reply;

  document.getElementById("reply").textContent=reply;
  jiraBtn.disabled=false;
  document.getElementById("jiraSection").style.display="none";
  msg.textContent="Reply generated.";
}

function shorten(){
  const r=document.getElementById("reply").textContent;
  if(!r || r==="Your generated response will appear here.") return;
  const sentences=r.split(/(?<=[.!?])\s+/);
  document.getElementById("reply").textContent=sentences.slice(0,2).join(" ");
}

function copyReply(){
  const text=document.getElementById("reply").textContent;
  if(!text || text==="Your generated response will appear here.") return;
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById("statusMsg").textContent="Reply copied to clipboard.";
  });
}

function normalizeSentence(text){
  let s=clean(text).replace(/^[-–—•]\s*/,'');
  if(!s) return s;
  s=s.replace(/\s+([,.;!?])/g,'$1');
  s=s.replace(/,{2,}/g,',');
  s=s.replace(/\.{2,}/g,'.');
  s=s.replace(/\s+-\s+/g,' — ');
  s=s.charAt(0).toUpperCase()+s.slice(1);
  if(!/[.!?]$/.test(s)) s += '.';
  return s;
}

function titleCaseSimple(text){
  return clean(text).split(/\s+/).map((w,i)=>{
    if(!w) return w;
    const lower=w.toLowerCase();
    const small=new Set(['a','an','the','and','or','to','of','in','on','for','by','with','is','are','has','have','only','as']);
    if(i>0 && small.has(lower)) return lower;
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(' ');
}

function buildJiraTicket(remark, context){
  const doc=extractDocument(remark) || '';
  const fields=extractFields(remark);
  const issues=extractIssueDetails(remark);
  const rr=extractRequestedRename(remark);
  const full=clean(remark+' '+context);
  const lower=full.toLowerCase();

  let summary='';
  let description='';
  let issueType='Bug';
  let priority=/high[- ]?priority|urgent|critical|asap/i.test(full) ? 'High' : 'Medium';
  let component='Document Processing / Validation';

  const pageNums=[...full.matchAll(/\b(\d+)\s+pages?\b/ig)].map(m=>Number(m[1]));
  if(pageNums.length>=2 && /page|breaking|split|dropping|dropped|retained|retain/i.test(full) && pageNums[0]>pageNums[1]){
    const expected=pageNums[0], actual=pageNums[1], diff=expected-actual;
    component='Document Processing / PDF Handling';
    summary=`${doc || 'Contract'} incorrectly reduces an ${expected}-page document to ${actual} pages`;
    description=`When processing the ${expected}-page ${doc ? doc.toLowerCase() : 'contract'} through Max, the output contains only ${actual} pages instead of the original ${expected}. This results in ${diff} ${diff===1?'page':'pages'} being dropped from the document. Can we take a look at the page-count and document-processing behavior and make sure all ${expected} pages are retained?`;
  } else if(rr){
    issueType='Enhancement';
    component='Document Classification / Naming';
    const oldName=rr.oldName || doc || 'Document';
    const newName=rr.newName || 'requested name';
    summary=`${titleCaseSimple(oldName)} name change required — rename to ${titleCaseSimple(newName)}`;
    description=`The client requested that ${oldName} be renamed to ${newName}. Please update the document naming so the requested name is reflected consistently in Max.`;
  } else if(/new version|version .*needed|need.*version|versioning/i.test(lower)){
    issueType='Enhancement';
    component='Document Classification / Versioning';
    const vm=full.match(/(?:version|ver(?:sion)?)\s*([0-9]{1,2}[_./-][0-9]{1,2}|[0-9]{2}[_./-][0-9]{2,4})/i);
    const versionText=vm ? ` Required version: ${vm[1]}.` : '';
    summary=`${doc || 'Document'} version mapping requires an update`;
    description=`Max is not recognizing the expected version of ${doc || 'the document'}.${versionText} Can we review the version mapping and make sure the required version is recognized correctly?`;
  } else if(/amendment/.test(lower) && /only\s*1|one.*active|active.*one|more than one|multiple amendments/i.test(full)) {
    component='Document Processing / Transaction Document Handling';
    issueType='Enhancement';
    summary='Max only allows one amendment to remain active, but multiple amendments may be required for the listing and contract';
    description='The client reported that several amendments may be associated with the listing agreement, but only one amendment can currently show as active while the remaining amendments are archived. They also noted that more than one amendment may be needed for the contract. Can we review the related amendment handling and active/archive logic so multiple applicable amendments can be retained and displayed as expected?';
  } else if(issues.length>1){
    component='Document Processing / Rule Validation';
    const detail1=normalizeSentence(issues[0]).replace(/[.!?]$/,'');
    const detail2=normalizeSentence(issues[1]).replace(/[.!?]$/,'');
    summary=buildDetailedSummary(doc, issues, fields);
    description=`The client reported the following issues with ${doc || 'the document'}: ${detail1}; ${detail2}. Can we review the related mapping and validation logic and address the reported issues without changing the expected business rules?`;
  } else {
    const detail=normalizeSentence(issues[0] || remark).replace(/[.!?]$/,'');
    if(/missing|not showing|cannot find|can't find|not present|dropped|split/i.test(lower)) component='Document Processing / Document Visibility';
    else if(/error|incorrect|wrong|still showing|should not|validation/i.test(lower)) component='Document Processing / Rule Validation';
    else if(/required|should|must|logic/i.test(lower)) { issueType='Enhancement'; component='Document Rules / Validation'; }

    const subject=doc || (fields.length ? fields[0] : 'Reported issue');
    summary=buildDetailedSummary(doc, issues, fields);
    let action='Can we take a look at the related logic and address the issue so the expected behavior is reflected in Max?';
    if(/missing|not showing|cannot find|can't find|not present|dropped|split/i.test(lower))
      action='Can we review the processing or mapping and make sure the expected information is retained and displayed correctly?';
    else if(/error|incorrect|wrong|still showing|should not|validation/i.test(lower))
      action='Can we review the related validation or mapping and correct the behavior so the appropriate error is triggered only when applicable?';
    else if(/required|should|must|logic/i.test(lower))
      action='Can we review the related rule or logic and align it with the requirement described above?';
    description=`The client reported that ${detail.toLowerCase()}. ${action}`;
  }

  return {summary: normalizeSummary(summary), issueType, priority, component, description: ensureDescription(description)};
}

function cleanSummaryText(text){
  let s=clean(text)
    .replace(/^for this one[,!:.-]?\s*/i,'')
    .replace(/^the client (reported|said|noted) that\s*/i,'')
    .replace(/\b(can we|could we|is there a way to|please|let us)\b.*$/i,'')
    .replace(/\s+([,.;!?])/g,'$1')
    .replace(/,{2,}/g,',')
    .replace(/\.{2,}/g,'.')
    .replace(/\s*[—-]\s*$/,'');
  if(!s) return s;
  s=s.charAt(0).toUpperCase()+s.slice(1);
  if(!/[.!?]$/.test(s)) s += '.';
  return s;
}

function trimAtSentenceBoundary(text, max=220){
  const s=cleanSummaryText(text);
  if(s.length<=max) return s;
  const sentences=s.match(/[^.!?]+[.!?]+/g) || [s];
  let out='';
  for(const sentence of sentences){
    const candidate=(out+' '+sentence).trim();
    if(candidate.length<=max) out=candidate;
    else break;
  }
  if(out) return out;
  const words=s.split(/\s+/);
  let result='';
  for(const word of words){
    const candidate=(result+' '+word).trim();
    if(candidate.length>max) break;
    result=candidate;
  }
  return result.replace(/[,:;—-]+$/,'')+'.';
}

function buildDetailedSummary(doc, issues, fields){
  const meaningful=issues.map(cleanSummaryText).filter(Boolean);
  let base=meaningful.join(' Also, ');
  if(doc && meaningful.length===1 && !meaningful[0].toLowerCase().includes(doc.toLowerCase())){
    base=`${doc}: ${meaningful[0]}`;
  }
  if(!base && fields.length) base=`${fields[0]} requires review.`;
  if(!base) base='Reported issue requires review.';
  return trimAtSentenceBoundary(base, 220);
}

function normalizeSummary(text){
  return trimAtSentenceBoundary(text, 220);
}

function ensureDescription(text){
  let s=clean(text).replace(/\s+([,.;!?])/g,'$1').replace(/,{2,}/g,',').replace(/\.{2,}/g,'.');
  s=s.charAt(0).toUpperCase()+s.slice(1);
  if(!/[.!?]$/.test(s)) s+='.';
  return s;
}

function generateJiraSummary(){
  const remark=lastRemark || document.getElementById('remark').value.trim();
  const context=lastContext || document.getElementById('context').value.trim();
  if(!remark) return;

  const ticket=buildJiraTicket(remark,context);
  const safe=(v)=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const jiraText=`Summary: ${ticket.summary}\n\nIssue Type: ${ticket.issueType}\n\nPriority: ${ticket.priority}\n\nComponent: ${ticket.component}\n\nDescription:\n${ticket.description}`;

  document.getElementById('jiraSummary').innerHTML=`
    <div class="jiraField"><div class="jiraLabel">Summary:</div><div class="jiraValue">${safe(ticket.summary)}</div></div>
    <div class="jiraField"><div class="jiraLabel">Issue Type:</div><div class="jiraValue">${safe(ticket.issueType)}</div></div>
    <div class="jiraField"><div class="jiraLabel">Priority:</div><div class="jiraValue">${safe(ticket.priority)}</div></div>
    <div class="jiraField"><div class="jiraLabel">Component:</div><div class="jiraValue">${safe(ticket.component)}</div></div>
    <div class="jiraField" style="margin-bottom:0"><div class="jiraLabel">Description:</div><div class="jiraValue jiraDescription">${safe(ticket.description)}</div></div>`;
  document.getElementById('jiraSummary').dataset.copyText=jiraText;
  document.getElementById('jiraSection').style.display='block';
  document.getElementById('statusMsg').textContent='Jira ticket details created.';
}

function copyJiraSummary(){
  const box=document.getElementById("jiraSummary");
  const text=box.dataset.copyText || box.innerText;
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById("statusMsg").textContent="Jira ticket copied to clipboard.";
  });
}

function clearAll(){
  document.getElementById("remark").value="";
  document.getElementById("context").value="";
  document.getElementById("reply").textContent="Your generated response will appear here.";
  document.getElementById("jiraSummary").innerHTML="";
  document.getElementById("jiraSummary").dataset.copyText="";
  document.getElementById("jiraSection").style.display="none";
  document.getElementById("jiraBtn").disabled=true;
  document.getElementById("statusMsg").textContent="";
  lastRemark=""; lastContext="";
}
</script>
</body>
